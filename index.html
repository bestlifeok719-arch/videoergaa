no(ac,dest,m,s,y.len,.17*MG);if(i%8==0)no(ac,dest,y.r-12+y.sc[0],s,y.len*2.5,.16*MG);

function kick(ac,dest,s){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(130,s);o.frequency.exponentialRampToValueAtTime(45,s+.12);g.gain.setValueAtTime(.4*MG,s);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.connect(g);g.connect(ac.destination);g.connect(dest);o.start(s);o.stop(s+.2)}
function tick(ac,dest,s){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=2200;g.gain.setValueAtTime(.05*MG,s);g.gain.exponentialRampToValueAtTime(.001,s+.04);o.connect(g);g.connect(ac.destination);g.connect(dest);o.start(s);o.stop(s+.05)}

let NB=null;
function noiseBuf(ac){if(!NB||NB.sampleRate!=ac.sampleRate){NB=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function noiseSrc(ac,dest,s,d,type,freq,vol,lfo){const sr=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();sr.buffer=noiseBuf(ac);sr.loop=true;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.2);if(lfo){for(let i=0;i<d;i+=.5)g.gain.linearRampToValueAtTime(vol*(.6+.4*Math.abs(Math.sin(i*1.7))),s+.2+i)}g.gain.linearRampToValueAtTime(0,s+d);sr.connect(f);f.connect(g);g.connect(ac.destination);g.connect(dest);sr.start(s);sr.stop(s+d+.05)}
function thump(ac,dest,s,f0,f1,v,d){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f0,s);o.frequency.exponentialRampToValueAtTime(f1,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d+.05);o.connect(g);g.connect(ac.destination);g.connect(dest);o.start(s);o.stop(s+d+.1)}
function sfxPlay(ac,dest,k,s,d,v){if(k=="steps"){for(let t=0;t<d;t+=.45)thump(ac,dest,s+t,110,55,.3*v,.1)}
else if(k=="door"){[0,.28,.56].forEach(t=>thump(ac,dest,s+t,220,110,.5*v,.08))}
else if(k=="clap"){for(let t=0;t<d;t+=.22+((t*7)%.1))noiseSrc(ac,dest,s+t,.06,"highpass",1500,.35*v)}
else if(k=="rain")noiseSrc(ac,dest,s,d,"bandpass",3500,.18*v);
else if(k=="crowd")noiseSrc(ac,dest,s,d,"bandpass",700,.22*v,true);
else if(k=="wind")noiseSrc(ac,dest,s,d,"lowpass",450,.2*v,true);
else if(k=="car")engine(ac,dest,"drive",s,d);
else if(k=="bell"){for(let t=0;t<d;t+=2){thump(ac,dest,s+t,880,870,.25*v,1.2);thump(ac,dest,s+t,1320,1310,.12*v,1)}}}

<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b1250">

<title>Video Ergaa</title>
<style>
:root{--ink:#2a0b3d;--pl:#3b1250;--or:#a855f7;--ro:#f43f8e;--bl:#fde7f3;--mu:#7c5a92}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.4 system-ui,sans-serif;background:var(--bl);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:auto;padding:18px 16px 32px}
h1{font-size:26px;font-weight:800;line-height:1.2;margin:8px 0 14px}
h2{font-size:15px;font-weight:700;color:var(--mu);margin:18px 0 8px}
.top{background:linear-gradient(135deg,var(--pl),var(--or) 60%,var(--ro));color:#fff;border-radius:0 0 28px 28px;padding:calc(20px + env(safe-area-inset-top)) 20px 22px;max-width:480px;margin:auto}
.top h1{margin:0;font-size:24px}
.big{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:18px;margin-bottom:10px;background:#fff;color:var(--ink);font:inherit;font-size:20px;font-weight:700;box-shadow:0 2px 0 #f1cfe3;cursor:pointer}
.big small{display:block;font-weight:500;font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .big{font-size:16px;margin:0;padding:16px 12px}
.grid .big.on,.opt.on{outline:3px solid var(--ro);background:#fff0f8}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ch{flex:0 0 auto;border:0;border-radius:16px;background:#fff;padding:4px}
.ch.on{outline:3px solid var(--ro)}
.opt{display:block;width:100%;text-align:left;border:0;border-radius:14px;background:#fff;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
textarea,input,select{width:100%;font:inherit;border:2px solid #e9c8dc;border-radius:14px;padding:12px;background:#fff;color:var(--ink)}
.go{display:block;width:100%;border:0;border-radius:999px;padding:16px;margin-top:18px;font:inherit;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--or),var(--ro));cursor:pointer}
.go.alt{background:#fff;color:var(--pl);box-shadow:inset 0 0 0 2px var(--or)}
.back{border:0;background:none;color:var(--pl);font:inherit;font-weight:700;padding:6px 0;cursor:pointer}
canvas,video{display:block;width:100%;max-width:320px;margin:10px auto;border-radius:22px;background:#000}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pl)}
.note{text-align:center;color:var(--mu);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>

am:{n:"አማርኛ",t:"ቪዲዮ መልእክት",cat:"የቪዲዮ ዓይነት ይምረጡ",msg:"መልእክት ይምረጡ",own:"ወይም በራስዎ ይጻፉ",nm:"ስም (አማራጭ)",ch:"ገጸ ባህሪ ይምረጡ",mu:"ሙዚቃ",auto:"በራስ-ሰር ይቀያየራል",mk:"ቪዲዮ ሥራ",sh:"አጋራ",dl:"አውርድ",ag:"እንደገና ሥራ",bk:"‹ ተመለስ",ins:"መተግበሪያውን ስልክዎ ላይ ይጫኑ",wt:"ቪዲዮው እየተሠራ ነው...",lg:"ቋንቋ"},
en:{n:"English",t:"Video Message",cat:"Choose a video type",msg:"Choose a message",own:"Or write your own",nm:"Name (optional)",ch:"Choose a character",mu:"Music",auto:"Changes automatically",mk:"Make video",sh:"Share",dl:"Download",ag:"Make again",bk:"‹ Back",ins:"Install the app on your phone",wt:"Making your video...",lg:"Language"}};

{id:"wd",om:"Fuudhaa fi Heerumaa",am:"ሰርግ",en:"Wedding",m:{om:["Baga gaa'ela keessan isin gahe!","Jaalalli keessan yeroo hundumaa haa jiraatu."],am:["እንኳን ለሠርጋችሁ አደረሳችሁ!","ፍቅራችሁ ዘላለማዊ ይሁን።"],en:["Congratulations on your wedding!","Wishing you a lifetime of love."]}},
{id:"ww",om:"Dubbii Ogummaa",am:"ጥበብ ያለው ቃል",en:"Wise Words",m:{om:["Waliin hojjechuun humna guddaa dha.","Obsi guddaa dha, injifannoon itti aanti."],am:["አንድነት ኃይል ነው።","ትዕግሥት ለድል ያደርሳል።"],en:["Together we are stronger.","Patience leads to victory."]}},
{id:"en",om:"Jajjabeessa",am:"ማበረታቻ",en:"Encouragement",m:{om:["Ati ni dandeessa, hin dhiifiin!","Har'a bu'aa gaarii argatta."],am:["ትችላለህ፣ አትተው!","ዛሬ ጥሩ ውጤት ታገኛለህ።"],en:["You can do it, never give up!","Today is your day."]}},
{id:"lv",om:"Jaalala",am:"ፍቅር",en:"Love",m:{om:["Si jaalladha.","Ati jireenya koo keessatti kennaa guddaa dha."],am:["እወድሃለሁ።","አንተ በሕይወቴ ታላቅ ስጦታ ነህ።"],en:["I love you.","You are a gift in my life."]}},
{id:"gm",om:"Ganama Gaarii",am:"እንደምን አደሩ",en:"Good Morning",m:{om:["Ganama gaarii!","Guyyaan har'aa gammachuun haa guutamu."],am:["እንደምን አደሩ! መልካም ቀን።","ዛሬ የደስታ ቀን ይሁንልዎ።"],en:["Good morning!","Have a wonderful day."]}},
{id:"bz",om:"Beeksisa Daldalaa",am:"የንግድ ማስታወቂያ",en:"Business Ad",m:{om:["Dukaanni keenya banamee jira. Isin eegna!","Gatii gaarii, tajaajila gaarii."],am:["ሱቃችን ተከፍቷል። እንጠብቃችኋለን!","ጥሩ ዋጋ፣ ጥሩ አገልግሎት።"],en:["We are open. Welcome!","Great prices, great service."]}},
{id:"hd",om:"Ayyaanota",am:"በዓላት",en:"Holidays",m:{om:["Baga Irreechaan isin gahe!","Waggaa haaraan gammachuu haa ta'u."],am:["እንኳን ለኢሬቻ አደረሳችሁ!","መልካም አዲስ ዓመት!"],en:["Happy Irreecha!","Happy New Year!"]}}];
const CH=[{sk:"#8d5524",ha:"#1b1b1b",lg:0,cl:"#a855f7"},{sk:"#c68642",ha:"#2b1a10",lg:0,cl:"#3b82f6"},{sk:"#8d5524",ha:"#1b1b1b",lg:1,cl:"#f43f8e"},{sk:"#e0ac69",ha:"#3a2314",lg:1,cl:"#10b981"}];
const MU=["Canon","Aria","Waltz"],DUR=16;
let st={lang:L.lang||"",cat:0,msg:0,txt:"",nm:"",ch:0,mu:-1},inst=null,url="";
addEventListener("beforeinstallprompt",e=>{e.preventDefault();inst=e;if(st.lang)home()});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pick(){$("#app").innerHTML=`<div class="top"><h1>Afaan kee filadhu<br>ቋንቋዎን ይምረጡ<br>Choose your language</h1></div><div id="app2" style="max-width:480px;margin:auto;padding:18px 16px">${["om","am","en"].map(k=>`<button class="big" data-l="${k}">${T[k].n}<small>${T[k].cat}</small></button>`).join("")}</div>`;
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;L.lang=st.lang;home()})}
function home(){const t=T[st.lang];$("#app").innerHTML=`<div class="top"><h1>${t.t}</h1></div><div id="app2" style="max-width:480px;margin:auto;padding:18px 16px"><h2>${t.cat}</h2><div class="grid">${C.map((c,i)=>`<button class="big" data-c="${i}">${c[st.lang]}</button>`).join("")}</div>${inst?`<button class="go alt" id="ins">${t.ins}</button>`:""}<button class="back" id="lg" style="margin-top:14px">${t.lg}: ${t.n}</button></div>`;
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{st.cat=+b.dataset.c;st.msg=0;st.txt="";make()});
$("#lg").onclick=pick;if(inst)$("#ins").onclick=()=>{inst.prompt();inst=null}}
function msgs(){return C[st.cat].m[st.lang]}
function make(){const t=T[st.lang],ms=msgs();$("#app").innerHTML=`<div class="top"><h1>${C[st.cat][st.lang]}</h1></div><div style="max-width:480px;margin:auto;padding:8px 16px 28px"><button class="back" id="bk">${t.bk}</button>
<h2>${t.ch}</h2><div class="row" id="chs">${CH.map((c,i)=>`<button class="ch ${i==st.ch?"on":""}" data-h="${i}"><canvas width="90" height="110" data-i="${i}" style="width:90px;height:110px;margin:0;background:none"></canvas></button>`).join("")}</div>
<h2>${t.msg}</h2><div id="ms">${ms.map((m,i)=>`<button class="opt ${i==st.msg&&!st.txt?"on":""}" data-m="${i}">${esc(m)}</button>`).join("")}</div>
<h2>${t.own}</h2><textarea id="tx" rows="2" maxlength="120">${esc(st.txt)}</textarea>
<h2>${t.nm}</h2><input id="nm" maxlength="24" value="${esc(st.nm)}">
<h2>${t.mu}</h2><select id="mu"><option value="-1">${t.auto}</option>${MU.map((m,i)=>`<option value="${i}" ${st.mu==i?"selected":""}>${m}</option>`).join("")}</select>
<button class="go" id="go">${t.mk}</button></div>`;
$("#bk").onclick=home;
document.querySelectorAll("canvas[data-i]").forEach(c=>{const g=c.getContext("2d");g.scale(.5,.5);g.translate(-90,-300);person(g,CH[+c.dataset.i],0,0)});
document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{st.ch=+b.dataset.h;document.querySelectorAll("[data-h]").forEach(x=>x.classList.toggle("on",x==b))});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{st.msg=+b.dataset.m;st.txt="";$("#tx").value="";document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x==b))});
$("#tx").oninput=e=>{st.txt=e.target.value;document.querySelectorAll("[data-m]").forEach(x=>x.classList.remove("on"))};
$("#nm").oninput=e=>st.nm=e.target.value;$("#mu").onchange=e=>st.mu=+e.target.value;
$("#go").onclick=record}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function person(g,c,t,talk){const b=Math.sin(t*4)*6;g.save();g.translate(180,380+b);
if(c.lg){g.fillStyle=c.ha;rr(g,-62,-62,124,150,50)}
g.fillStyle=c.cl;rr(g,-52,44,104,140,32);
g.strokeStyle=c.sk;g.lineWidth=17;g.lineCap="round";g.beginPath();g.moveTo(-48,70);g.lineTo(-68,128);g.stroke();
const a=Math.sin(t*8)*.45,th=-.95+a;g.beginPath();g.moveTo(48,70);g.lineTo(48+62*Math.cos(th),70+62*Math.sin(th));g.stroke();
g.fillStyle=c.sk;g.beginPath();g.arc(0,0,56,0,7);g.fill();
g.fillStyle=c.ha;g.beginPath();g.arc(0,-6,58,3.3,6.1);g.fill();
g.fillStyle="#2a0b3d";if(t%3<.15){g.fillRect(-27,-4,16,3);g.fillRect(11,-4,16,3)}else{g.beginPath();g.arc(-19,-3,6,0,7);g.arc(19,-3,6,0,7);g.fill()}
g.fillStyle="#f43f8e";g.globalAlpha=.35;g.beginPath();g.arc(-36,16,9,0,7);g.arc(36,16,9,0,7);g.fill();g.globalAlpha=1;
g.fillStyle="#7a1e3d";g.beginPath();const o=talk?4+Math.abs(Math.sin(t*10))*10:3;g.ellipse(0,24,12,o,0,0,7);g.fill();g.restore()}
function wrap(g,s,x,y,w,lh){const ws=s.split(/\s+/),ls=[];let l="";ws.forEach(k=>{const n=l?l+" "+k:k;if(g.measureText(n).width>w&&l){ls.push(l);l=k}else l=n});ls.push(l);ls.forEach((q,i)=>g.fillText(q,x,y+i*lh));return ls.length}
function frame(g,t,txt,nm){const h=(300+t*8)%360;const gr=g.createLinearGradient(0,0,360,640);gr.addColorStop(0,"#3b1250");gr.addColorStop(.55,"#a855f7");gr.addColorStop(1,"#f43f8e");g.fillStyle=gr;g.fillRect(0,0,360,640);
g.fillStyle="#fff";g.globalAlpha=.22;g.font="26px sans-serif";g.textAlign="center";for(let i=0;i<9;i++){g.fillText(i%2?"♥":"✦",(i*89+20)%340+10,640-((t*38+i*91)%700))}g.globalAlpha=1;
g.font="800 27px system-ui,sans-serif";g.fillStyle="#fff";g.shadowColor="rgba(0,0,0,.35)";g.shadowBlur=8;
const w=txt.split(/\s+/),n=Math.min(w.length,Math.max(0,Math.floor((t-.4)*2.6)));wrap(g,w.slice(0,n).join(" "),180,120,300,36);g.shadowBlur=0;
person(g,CH[st.ch],t,t<DUR-2&&n<=w.length);
if(nm){g.font="700 22px system-ui,sans-serif";g.fillStyle="#fff";g.fillText("— "+nm,180,570)}
g.font="13px system-ui,sans-serif";g.globalAlpha=.7;g.fillText("Video Ergaa",180,618);g.globalAlpha=1}
const TR=[[[62,66,69],[57,61,64],[59,62,66],[54,57,61],[55,59,62],[62,66,69],[55,59,62],[57,61,64]],[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],[[67,71,74],[64,67,71],[60,64,67],[62,66,69]]];
function score(ac,dest,t0){const bt=.32;for(let i=0;i*bt<DUR;i++){const s=t0+i*bt,tr=st.mu<0?Math.floor(i*bt/4)%3:st.mu,p=TR[tr],ch=p[Math.floor(i/4)%p.length];
n(ac,dest,ch[i%3]+(i%8==7?12:0),s,.6);if(i%4==0)n(ac,dest,ch[0]-24,s,1.2,.2)}}
function n(ac,dest,m,s,d,v=.15){const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);g.connect(dest);o.start(s);o.stop(s+d+.05)}
async function record(){const t=T[st.lang],txt=(st.txt.trim()||msgs()[st.msg]);
$("#app").innerHTML=`<div class="top"><h1>${t.wt}</h1></div><div style="max-width:480px;margin:auto;padding:8px 16px"><canvas id="cv" width="360" height="640"></canvas></div>`;
const cv=$("#cv"),g=cv.getContext("2d"),ac=new(window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination(),s=cv.captureStream(30);
dest.stream.getAudioTracks().forEach(k=>s.addTrack(k));
const mt=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
const rec=new MediaRecorder(s,mt?{mimeType:mt,videoBitsPerSecond:900000}:{}),ch=[];rec.ondata=0;rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{ac.close();done(new Blob(ch,{type:mt||"video/webm"}),mt.includes("mp4")?"mp4":"webm")};
const t0=ac.currentTime+.1;score(ac,dest,t0);rec.start();
(function lp(){const t=ac.currentTime-t0;frame(g,Math.max(0,t),txt,st.nm.trim());if(t<DUR)requestAnimationFrame(lp);else rec.stop()})()}
function done(bl,ext){const t=T[st.lang];if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(bl);const f=new File([bl],"video-ergaa."+ext,{type:bl.type});
$("#app").innerHTML=`<div class="top"><h1>${t.t}</h1></div><div style="max-width:480px;margin:auto;padding:8px 16px 28px"><video src="${url}" controls playsinline autoplay loop></video><button class="go" id="sh">${t.sh}</button><a class="go alt" id="dl" href="${url}" download="video-ergaa.${ext}" style="text-align:center;text-decoration:none">${t.dl}</a><button class="go alt" id="ag">${t.ag}</button><button class="back" id="hm" style="margin-top:12px">${t.bk}</button></div>`;
$("#sh").onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else $("#dl").click()}catch(e){}};
$("#ag").onclick=make;$("#hm").onclick=home}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
st.lang&&T[st.lang]?home():pick();
</script>

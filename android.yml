name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      REWARDED_ID: ca-app-pub-3940256099942544/5224354917
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html sw.js manifest.webmanifest privacy.html icon-192.png icon-512.png www/
          sed -i "s#ads:false#ads:true#; s#ca-app-pub-3940256099942544/5224354917#$REWARDED_ID#" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Add microphone permission
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Add AdMob app id
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: video-ergaa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
